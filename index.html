<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cell-game</title>
    <style>
      /* Era 1 is monochrome: one foreground, one background. Color arrives in Era 2. */
      :root {
        color-scheme: light dark;
        --bg: #fbfbf8;
        --fg: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e0e;
          --fg: #d6d6d0;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      .screen {
        margin: 0;
        padding: 8px;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace;
        /* 72 columns fit the viewport: a monospace glyph is about 0.6em wide. */
        font-size: min(15px, calc((100vw - 16px) / 43.5));
        line-height: 1.3;
        white-space: pre;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .probe {
        position: absolute;
        visibility: hidden;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <pre id="screen" class="screen">loading...</pre>
    <pre class="screen probe" aria-hidden="true"><span id="probe">M</span></pre>
    <noscript><pre class="screen">This game needs JavaScript.</pre></noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
